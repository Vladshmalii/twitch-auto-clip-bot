version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: twitch_postgres
    environment:
      POSTGRES_USER: twitch_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: twitch_clips
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twitch_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: twitch_bot
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://twitch_user:${POSTGRES_PASSWORD:-change_me}@postgres:5432/twitch_clips
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./static:/app/static
      - ./templates:/app/templates
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  postgres_data: